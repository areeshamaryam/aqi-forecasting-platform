name: Hourly Feature Pipeline

on:
  schedule:
    # Runs at minute 0 of every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:
    # Allows manually triggering this workflow from the
    # GitHub Actions tab, useful for testing.

jobs:
  fetch-and-upload-features:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
           pip install -r requirements-ci.txt

      - name: Run hourly pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python -m ml_pipeline.run_hourly_pipeline
